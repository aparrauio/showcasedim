name: Update screenshots

on:
  push:
    branches: [main]
    paths: ['src/data/sites.json']
  schedule:
    - cron: '0 6 * * 1' # lunes 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Volver a capturar todas las webs'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture
        run: node scripts/screenshots.mjs ${{ inputs.force && '--force' || '' }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/shots src/data/shots.json
          if git diff --cached --quiet; then
            echo "Sin cambios en las capturas."
          else
            git commit -m "chore: actualizar capturas"
            git pull --rebase
            git push
          fi
